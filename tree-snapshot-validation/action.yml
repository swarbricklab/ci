name: 'DVC Tree Snapshot Validation'
description: 'Ensure tree.txt snapshot is up to date with DVC-tracked files'
inputs:
  tree-file:
    description: 'Path to the tree snapshot file'
    required: false
    default: 'tree.txt'

runs:
  using: 'composite'
  steps:
    - name: Configure SSH for DVC
      shell: bash
      run: |
        # Ensure SSH uses the atlas_key for authentication
        # This is critical because composite actions may run as root,
        # and we need to explicitly specify the identity file
        export GIT_SSH_COMMAND="ssh -i ~/.ssh/atlas_key -F ~/.ssh/config"
        echo "GIT_SSH_COMMAND=$GIT_SSH_COMMAND" >> $GITHUB_ENV
    
    - name: Generate current tree snapshot
      shell: bash
      run: |
        set -euo pipefail
        
        # Capture stderr to check for errors even if command succeeds
        if ! dvc list --dvc-only --tree . > tree.snapshot.txt 2> /tmp/dvc_stderr.txt; then
          echo "::error::dvc list failed"
          cat /tmp/dvc_stderr.txt >&2
          exit 1
        fi
        
        # Check stderr for errors even when command succeeded
        if grep -qE "(ERROR|Permission denied)" /tmp/dvc_stderr.txt 2>/dev/null; then
          echo "::error::dvc list encountered errors:"
          cat /tmp/dvc_stderr.txt >&2
          exit 1
        fi
        
        rm -f /tmp/dvc_stderr.txt

    - name: Verify tree snapshot is up to date
      shell: bash
      env:
        TREE_FILE: ${{ inputs.tree-file }}
      run: |
        set -euo pipefail
        if [ ! -f "$TREE_FILE" ]; then
          echo "::error file=$TREE_FILE::$TREE_FILE is missing. Run 'dvc list --dvc-only --tree . > $TREE_FILE' and commit the result."
          exit 1
        fi

        if ! diff -u "$TREE_FILE" tree.snapshot.txt; then
          echo "::error file=$TREE_FILE::$TREE_FILE is out of date. Run 'dvc list --dvc-only --tree . > $TREE_FILE' and commit the updated file."
          exit 1
        fi
        
        echo "✅ Tree snapshot is up to date"

    - name: Clean up temporary files
      if: always()
      shell: bash
      run: rm -f tree.snapshot.txt
