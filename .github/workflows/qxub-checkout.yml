name: QXUB Checkout

on:
  workflow_call:
    inputs:
      nci-user:
        description: 'NCI username'
        required: true
        type: string
      nci-project:
        description: 'NCI project allocation (e.g., a56)'
        required: false
        type: string
        default: 'a56'
      repository:
        description: 'Repository name'
        required: true
        type: string
      pr-number:
        description: 'Pull request number'
        required: true
        type: string
      run-id:
        description: 'GitHub Actions run ID'
        required: true
        type: string
      branch-ref:
        description: 'Branch reference to checkout'
        required: true
        type: string
      dvc-env:
        description: 'DVC environment name on NCI'
        required: false
        type: string
        default: 'dt3'
    secrets:
      github-token:
        description: 'GitHub token for posting PR comments'
        required: true

jobs:
  clone:
    runs-on: qxub-runner
    outputs:
      has_dvc: ${{ steps.check-dvc.outputs.has_dvc }}
    steps:
      - name: Clone repository to NCI
        run: |
          CLONE_DIR=/scratch/${{ inputs.nci-project }}/${{ inputs.nci-user }}/ci/${{ inputs.repository }}/pr-${{ inputs.pr-number }}/run-${{ inputs.run-id }}
          qxub exec -v \
            --env ${{ inputs.dvc-env }} \
            --queue copyq \
            -- dt clone --no-auth --overwrite --rev ${{ inputs.branch-ref }} git@github.com:${{ github.repository }}.git $CLONE_DIR

      - name: Check for DVC pipeline
        id: check-dvc
        env:
          GH_TOKEN: ${{ secrets.github-token }}
        run: |
          if gh api repos/${{ github.repository }}/contents/dvc.yaml?ref=${{ inputs.branch-ref }} --silent 2>/dev/null; then
            echo "has_dvc=true" >> $GITHUB_OUTPUT
          else
            echo "has_dvc=false" >> $GITHUB_OUTPUT
          fi

      - name: Report missing DVC pipeline
        if: steps.check-dvc.outputs.has_dvc == 'false'
        env:
          GH_TOKEN: ${{ secrets.github-token }}
        run: |
          gh pr comment ${{ inputs.pr-number }} -R ${{ github.repository }} --body "DVC pipeline not found"

  check-repro:
    needs: clone
    if: needs.clone.outputs.has_dvc == 'true'
    runs-on: qxub-runner
    steps:
      - name: Pull DVC data
        run: |
          CLONE_DIR=/scratch/${{ inputs.nci-project }}/${{ inputs.nci-user }}/ci/${{ inputs.repository }}/pr-${{ inputs.pr-number }}/run-${{ inputs.run-id }}
          qxub exec -v \
            --queue copyq \
            --env ${{ inputs.dvc-env }} \
            --execdir $CLONE_DIR \
            -- dt pull

      - name: Check repro
        env:
          GH_TOKEN: ${{ secrets.github-token }}
        run: |
          set -o pipefail

          echo -e "Running dvc repro --dry to check if pipeline is up to date...\n\n" > repro-dry.txt
          CLONE_DIR=/scratch/${{ inputs.nci-project }}/${{ inputs.nci-user }}/ci/${{ inputs.repository }}/pr-${{ inputs.pr-number }}/run-${{ inputs.run-id }}

          qxub exec -v \
            --queue normal \
            --mem 32GB \
            --cpus 8 \
            --volumes gdata/a56 \
            --env ${{ inputs.dvc-env }} \
            --execdir $CLONE_DIR \
            -- dvc repro --dry -vv 2>&1 | tee -a repro-dry.txt
          qxub_status=${PIPESTATUS[0]}

          echo "\n--- qxub exit status: ${qxub_status} ---" | tee -a repro-dry.txt

          echo "--- Begin repro-dry.txt ---"
          cat repro-dry.txt || true
          echo "--- End repro-dry.txt ---"

          tail -n +10 repro-dry.txt | grep -v skipping > repro-dry-clean.txt || true
          if [[ -s repro-dry-clean.txt ]]; then
            gh pr comment ${{ inputs.pr-number }} -R ${{ github.repository }} --body-file repro-dry-clean.txt || \
              echo "Warning: failed to post repro output comment"
          fi

          if [[ ${qxub_status} -ne 0 ]]; then
            echo "::error::qxub exec failed with exit code ${qxub_status}. See repro-dry.txt above."
            exit ${qxub_status}
          fi

          if grep -q "Data and pipelines are up to date" repro-dry.txt; then
            echo "Pipeline is up to date."
            exit 0
          else
            echo "::error::Pipeline is out of date or check failed. See repro-dry.txt above."
            exit 1
          fi
