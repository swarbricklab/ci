name: 'QXUB Cleanup'
description: 'Clean up a temporary CI clone on NCI scratch space. Removes the whole pr-<n> tree on PR triggers, or an explicit workspace path on push triggers.'
inputs:
  nci-user:
    description: 'NCI username'
    required: true
  nci-project:
    description: 'NCI project allocation (e.g., a56)'
    required: false
    default: 'a56'
  repository:
    description: 'Repository name'
    required: true
  pr-number:
    description: 'Pull request number (PR triggers). When set, the whole ci/<repository>/pr-<n> tree is removed.'
    required: false
    default: ''
  workspace:
    description: 'Explicit workspace path under ci/<repository>/ to remove (push triggers, e.g. "run-<run-id>"). Takes precedence over pr-number.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Remove clone directory from NCI
      shell: bash
      run: |
        base=/scratch/${{ inputs.nci-project }}/${{ inputs.nci-user }}/ci/${{ inputs.repository }}
        if [ -n "${{ inputs.workspace }}" ]; then
          target="${base}/${{ inputs.workspace }}"
        elif [ -n "${{ inputs.pr-number }}" ]; then
          target="${base}/pr-${{ inputs.pr-number }}"
        else
          echo "::error::qxub-cleanup requires either workspace or pr-number"
          exit 1
        fi
        echo "Cleaning up: $target"
        qxub exec \
          --queue copyq \
          -- rm -rf "$target"
