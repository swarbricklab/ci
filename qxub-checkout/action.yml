name: 'QXUB Checkout'
description: 'Clone repository to NCI via QXUB. Outputs has_dvc=true/false for use by downstream jobs.'
inputs:
  nci-user:
    description: 'NCI username'
    required: true
  nci-project:
    description: 'NCI project allocation (e.g., a56)'
    required: false
    default: 'a56'
  repository:
    description: 'Repository name'
    required: true
  pr-number:
    description: 'Pull request number'
    required: true
  run-id:
    description: 'GitHub Actions run ID'
    required: true
  branch-ref:
    description: 'Branch reference to checkout'
    required: true
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true

outputs:
  has_dvc:
    description: 'Whether the repository has a DVC pipeline'
    value: ${{ steps.check-dvc.outputs.has_dvc }}

runs:
  using: 'composite'
  steps:
    - name: Clone repository to NCI
      shell: bash
      run: |
        CLONE_DIR=/scratch/${{ inputs.nci-project }}/${{ inputs.nci-user }}/ci/${{ inputs.repository }}/pr-${{ inputs.pr-number }}/run-${{ inputs.run-id }}
        # A repo clone needs only system git+ssh (copyq's default env), not the
        # dt/dvc module — module envs don't carry the ssh binary git needs for
        # the git@github.com remote. dvc operations that DO need the module run
        # later in qxub-check-repro (dvc's ssh goes via paramiko, not system ssh).
        qxub exec -v \
          --default \
          --queue copyq \
          --cmd "rm -rf $CLONE_DIR && git clone --branch ${{ inputs.branch-ref }} git@github.com:${{ github.repository }}.git $CLONE_DIR"

    - name: Check for DVC pipeline
      id: check-dvc
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        if gh api repos/${{ github.repository }}/contents/dvc.yaml?ref=${{ inputs.branch-ref }} --silent 2>/dev/null; then
          echo "has_dvc=true" >> $GITHUB_OUTPUT
        else
          echo "has_dvc=false" >> $GITHUB_OUTPUT
        fi

    - name: Report missing DVC pipeline
      if: steps.check-dvc.outputs.has_dvc == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh pr comment ${{ inputs.pr-number }} -R ${{ github.repository }} --body "DVC pipeline not found"
