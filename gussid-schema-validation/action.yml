name: 'GUSSID Schema Validation'
description: 'Validate GUSSIDs in an index.csv against the Swarbricklab GUSSID schema'
inputs:
  index-file:
    description: 'Path to the index CSV file'
    required: false
    default: 'index.csv'
  gussid-column:
    description: 'Name of the GUSSID column'
    required: false
    default: 'gussid'
  donor-column:
    description: 'Name of the donor id column (checked against the GUSSID donor segment)'
    required: false
    default: 'donor_id'
  tissue-column:
    description: 'Name of the tissue id column (checked against a T<n> segment)'
    required: false
    default: 'tissue_id'
  prefix:
    description: 'If set, require every GUSSID to use this exact prefix (e.g. XEN)'
    required: false
    default: ''
  compartments:
    description: 'Comma-separated compartment letters that may precede a number in the tissue segment (e.g. "T,B"). Default "T".'
    required: false
    default: 'T'
  letter-codes:
    description: 'Comma-separated bare letter-code segments to allow with no number (e.g. "TL,TR,TN"). Default none.'
    required: false
    default: ''
  check-tissue-match:
    description: 'If true, a numeric T<n> segment must match the tissue_id. Default true.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Validate GUSSID schema
      shell: bash
      env:
        INDEX_FILE: ${{ inputs.index-file }}
        GUSSID_COLUMN: ${{ inputs.gussid-column }}
        DONOR_COLUMN: ${{ inputs.donor-column }}
        TISSUE_COLUMN: ${{ inputs.tissue-column }}
        PREFIX: ${{ inputs.prefix }}
        COMPARTMENTS: ${{ inputs.compartments }}
        LETTER_CODES: ${{ inputs.letter-codes }}
        CHECK_TISSUE_MATCH: ${{ inputs.check-tissue-match }}
      run: |
        python3 - <<'PYTHON_SCRIPT'
        #!/usr/bin/env python3
        """Validate GUSSIDs in an index CSV against the Swarbricklab GUSSID schema.
        
        GUSSID = <PREFIX>_<donor>_<SEG>_S<sample>
          - <SEG> is a compartment segment, one of:
              * <compartment-letter><number>  (compartment in COMPARTMENTS, default "T"; e.g. T0, B3)
              * a bare letter-code listed in LETTER_CODES (e.g. TL, TR, TN) -- no number
            Anything else (e.g. T1G, T1AF, TA when not a listed code) is malformed.
          - <sample> is an integer; within each (donor, SEG) the samples run 1..n, no gaps/repeats.
          - <donor> equals the donor_id column; GUSSIDs are unique.
          - When CHECK_TISSUE_MATCH is true, a numeric "T"-compartment segment T<n> must
            match the tissue_id (bare -> 0; <donor>-<N> -> N; <donor>-<letter> -> A=1,B=2,...).
        """
        from __future__ import annotations
        import csv, os, re, sys
        from collections import defaultdict
        
        INDEX_FILE = os.environ.get("INDEX_FILE", "index.csv")
        GUSSID_COL = os.environ.get("GUSSID_COLUMN", "gussid")
        DONOR_COL  = os.environ.get("DONOR_COLUMN", "donor_id")
        TISSUE_COL = os.environ.get("TISSUE_COLUMN", "tissue_id")
        PREFIX     = os.environ.get("PREFIX", "").strip()
        COMPARTMENTS = [c.strip().upper() for c in os.environ.get("COMPARTMENTS", "T").split(",") if c.strip()]
        LETTER_CODES = {c.strip().upper() for c in os.environ.get("LETTER_CODES", "").split(",") if c.strip()}
        CHECK_TISSUE_MATCH = os.environ.get("CHECK_TISSUE_MATCH", "true").strip().lower() in ("1", "true", "yes")
        
        prefix_pat = re.escape(PREFIX) if PREFIX else r"[A-Za-z0-9]+"
        GUSSID_RE = re.compile(rf"^(?P<prefix>{prefix_pat})_(?P<donor>.+)_(?P<seg>[^_]+)_S(?P<s>\d+)$")
        comp_set = "".join(re.escape(c) for c in COMPARTMENTS)
        NUM_SEG_RE = re.compile(rf"^(?P<c>[{comp_set}])(?P<n>\d+)$") if comp_set else None
        
        def ann(level, msg, line=None):
            loc = f"file={INDEX_FILE},line={line}" if line else f"file={INDEX_FILE}"
            print(f"::{level} {loc}::{msg}")
        
        def expected_tissue_num(donor, tissue_id):
            if tissue_id == donor:
                return 0
            if tissue_id.startswith(donor + "-"):
                suf = tissue_id[len(donor) + 1:]
                if suf.isdigit():
                    return int(suf)
                if len(suf) == 1 and suf.isalpha():
                    return ord(suf.upper()) - ord("A") + 1
            return None
        
        def main():
            if not os.path.exists(INDEX_FILE):
                ann("error", f"Missing required file: {INDEX_FILE}"); return 1
            with open(INDEX_FILE, newline="", encoding="utf-8-sig") as fh:
                reader = csv.DictReader(fh)
                if GUSSID_COL not in (reader.fieldnames or []):
                    ann("error", f"No '{GUSSID_COL}' column (columns: {reader.fieldnames})"); return 1
                rows = list(reader)
        
            fails = 0
            seen = {}
            s_by_group = defaultdict(list)   # (donor, seg) -> [(s, line)]
            for i, row in enumerate(rows, start=2):
                g = (row.get(GUSSID_COL) or "").strip()
                if not g:
                    continue
                if g in seen:
                    ann("error", f"Duplicate GUSSID '{g}' (first seen line {seen[g]})", i); fails += 1
                else:
                    seen[g] = i
                m = GUSSID_RE.match(g)
                if not m:
                    ann("error", f"Malformed GUSSID '{g}' (expected <prefix>_<donor>_<seg>_S<int>)", i); fails += 1
                    continue
                donor, seg, S = m.group("donor"), m.group("seg"), int(m.group("s"))
        
                num = NUM_SEG_RE.match(seg) if NUM_SEG_RE else None
                if not num and seg not in LETTER_CODES:
                    allowed = f"{'/'.join(c+'<n>' for c in COMPARTMENTS)}" + (f" or one of {sorted(LETTER_CODES)}" if LETTER_CODES else "")
                    ann("error", f"Invalid tissue segment '{seg}' in '{g}' (must be {allowed}; a compound like T1G is invalid)", i); fails += 1
                    continue
        
                donor_col = (row.get(DONOR_COL) or "").strip()
                if DONOR_COL in row and donor_col and donor != donor_col:
                    ann("error", f"GUSSID donor '{donor}' != {DONOR_COL} '{donor_col}' in '{g}'", i); fails += 1
        
                if CHECK_TISSUE_MATCH and num and num.group("c") == "T":
                    tissue_id = (row.get(TISSUE_COL) or "").strip()
                    if TISSUE_COL in row and tissue_id:
                        exp = expected_tissue_num(donor, tissue_id)
                        if exp is None:
                            ann("warning", f"Cannot derive expected tissue number from {TISSUE_COL} '{tissue_id}' for '{g}'", i)
                        elif exp != int(num.group("n")):
                            ann("error", f"GUSSID tissue T{num.group('n')} != tissue_id '{tissue_id}' (expected T{exp}) in '{g}'", i); fails += 1
        
                s_by_group[(donor, seg)].append((S, i))
        
            for (donor, seg), items in sorted(s_by_group.items()):
                ss = sorted(x[0] for x in items)
                if ss != list(range(1, len(ss) + 1)):
                    ann("error", f"donor {donor} {seg}: _S must run 1..{len(ss)} with no gaps/repeats, got S={ss}", min(x[1] for x in items)); fails += 1
        
            populated = len(seen)
            if fails:
                print(f"\n❌ {fails} GUSSID schema violation(s) across {populated} populated GUSSID(s) in {INDEX_FILE}.")
                return 1
            print(f"✅ All {populated} populated GUSSID(s) in {INDEX_FILE} conform to the schema.")
            return 0
        
        if __name__ == "__main__":
            sys.exit(main())
        PYTHON_SCRIPT
