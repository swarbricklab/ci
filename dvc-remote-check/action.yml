name: 'DVC Remote Check'
description: 'Check DVC remote status, calculate diff, and validate data presence'
inputs:
  base-ref:
    description: 'Base git reference to compare against'
    required: false
    default: 'origin/main'
  dvc-remote:
    description: 'DVC remote name'
    required: false
    default: 'gs'
  pr-number:
    description: 'Pull request number for posting comments'
    required: true
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Force reinstall dt and qxub
      shell: bash
      run: |
        if [ -x /opt/qxub-venv/bin/pip ]; then
          PIP_BIN="/opt/qxub-venv/bin/pip"
        elif command -v python3 &>/dev/null; then
          PIP_BIN="python3 -m pip"
        elif command -v python &>/dev/null; then
          PIP_BIN="python -m pip"
        else
          echo "::error::Python not found on runner; cannot reinstall dt/qxub"
          exit 1
        fi

        $PIP_BIN install --upgrade pip setuptools wheel

        # Reinstall from source-of-truth repos to avoid stale/broken runner images.
        $PIP_BIN install --upgrade --force-reinstall --no-cache-dir \
          "git+https://github.com/swarbricklab/qxub.git"
        $PIP_BIN install --upgrade --force-reinstall --no-cache-dir \
          "dvc-tools[gcp] @ git+https://github.com/swarbricklab/dvc_tools.git"

        qxub --version
        dt --version

    - name: Install credentials
      shell: bash
      run: |
        if command -v dt &>/dev/null; then
          echo "Installing DVC remote credentials via dt..."
          dt auth credentials install -v
        else
          echo "::warning::dt not available — skipping credential install"
        fi

    - name: Calculate and post DVC diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        dvc remote default ${{ inputs.dvc-remote }}

        # Compare base ref to HEAD (not workspace — data files aren't materialized)
        if ! dt diff --old ${{ inputs.base-ref }} --new HEAD --output md > dvc-diff.md 2>&1; then
          echo "::error::dt diff failed:"
          cat dvc-diff.md >&2
          exit 1
        fi

        # GitHub caps PR comment bodies at 65536 chars; a large diff (e.g. a PR
        # adding thousands of DVC-tracked files) would otherwise make the comment
        # fail and take the whole job down with it. The diff is informational —
        # the data-in-remote check below is the actual gate — so truncate the
        # body and never let a comment failure fail the job.
        LIMIT=60000
        if [ "$(wc -c < dvc-diff.md)" -gt "$LIMIT" ]; then
          full=$(wc -c < dvc-diff.md)
          { head -c "$LIMIT" dvc-diff.md
            printf '\n\n_…diff truncated — %s bytes exceeds the 65536-char GitHub comment limit._\n' "$full"
          } > dvc-diff.trunc.md
          mv dvc-diff.trunc.md dvc-diff.md
        fi
        gh pr comment ${{ inputs.pr-number }} --body-file dvc-diff.md \
          || echo "::warning::failed to post DVC diff comment (continuing)"

    - name: Check DVC data not in remote
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        dvc remote default ${{ inputs.dvc-remote }}
        dvc data status --not-in-remote --granular > missing-files.txt 2> missing-stderr.txt || true

        # Fail immediately if DVC reported errors
        if [ -s missing-stderr.txt ] && grep -qiE "^ERROR:|Traceback|No module named" missing-stderr.txt; then
          echo "::error::dvc data status failed with errors:"
          cat missing-stderr.txt >&2
          exit 1
        fi

        # Check if anything is missing
        if grep -q "new:" missing-files.txt || grep -q "modified:" missing-files.txt; then
          {
            echo '## :warning: DVC Data Missing from Remote'
            echo ''
            echo 'The following files are not in the remote storage:'
            echo ''
            echo '```'
            cat missing-files.txt
            echo '```'
          } > missing-comment.md

          # Truncate under GitHub's 65536-char comment limit; a comment failure
          # must not mask the real failure (missing data) signalled by exit 1.
          LIMIT=60000
          if [ "$(wc -c < missing-comment.md)" -gt "$LIMIT" ]; then
            head -c "$LIMIT" missing-comment.md > missing-comment.trunc.md
            printf '\n```\n\n_…list truncated (exceeds the GitHub comment limit)._\n' >> missing-comment.trunc.md
            mv missing-comment.trunc.md missing-comment.md
          fi
          gh pr comment ${{ inputs.pr-number }} --body-file missing-comment.md \
            || echo "::warning::failed to post missing-data comment"

          echo "ERROR: Some DVC-tracked files are missing from the remote"
          exit 1
        else
          echo "All DVC-tracked files are present in the remote"
        fi
