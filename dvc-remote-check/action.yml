name: 'DVC Remote Check'
description: 'Check DVC remote status, calculate diff, and validate data presence'
inputs:
  base-ref:
    description: 'Base git reference to compare against'
    required: false
    default: 'origin/main'
  dvc-remote:
    description: 'DVC remote name'
    required: false
    default: 'gs'
  pr-number:
    description: 'Pull request number for posting comments'
    required: true
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install credentials
      shell: bash
      run: |
        if command -v dt &>/dev/null; then
          echo "Installing DVC remote credentials via dt..."
          dt auth credentials install -v
        else
          echo "::warning::dt not available — skipping credential install"
        fi

    - name: Diagnose credential paths
      shell: bash
      run: |
        echo "=== DVC_GLOBAL_CONFIG_DIR ==="
        echo "DVC_GLOBAL_CONFIG_DIR=${DVC_GLOBAL_CONFIG_DIR:-not set}"

        echo "=== DVC global config dir (Python) ==="
        python3 -c "from dvc.dirs import global_config_dir; print(global_config_dir())" || echo "FAILED"

        echo "=== DVC global config contents ==="
        GLOBAL_CFG=$(python3 -c "from dvc.dirs import global_config_dir; import os; print(os.path.join(global_config_dir(), 'config'))" 2>/dev/null)
        echo "Path: $GLOBAL_CFG"
        if [ -f "$GLOBAL_CFG" ]; then
          cat "$GLOBAL_CFG"
        else
          echo "File does not exist"
        fi

        echo "=== dt platformdirs path ==="
        python3 -c "from platformdirs import user_config_dir; import os; print(os.path.join(user_config_dir('dvc'), 'config'))" || echo "FAILED"

        echo "=== DVC config read via dvc cli ==="
        dvc config --global remote.bcarc_wgs.access_key_id 2>&1 || echo "FAILED"

        echo "=== HOME and XDG ==="
        echo "HOME=$HOME"
        echo "XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-not set}"

    - name: Calculate and post DVC diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        dvc remote default ${{ inputs.dvc-remote }}

        # Compare base ref to HEAD (not workspace — data files aren't materialized)
        if ! dt diff --old ${{ inputs.base-ref }} --new HEAD --output md > dvc-diff.md 2>&1; then
          echo "::error::dt diff failed:"
          cat dvc-diff.md >&2
          exit 1
        fi

        gh pr comment ${{ inputs.pr-number }} --body-file dvc-diff.md

    - name: Check DVC data not in remote
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        dvc remote default ${{ inputs.dvc-remote }}
        dvc data status --not-in-remote --granular -v > missing-files.txt 2> missing-stderr.txt || true

        echo "--- missing-files.txt ---"
        cat missing-files.txt || true
        echo "--- missing-stderr.txt ---"
        cat missing-stderr.txt || true
        echo "--- end ---"

        # Fail immediately if DVC reported errors
        if [ -s missing-stderr.txt ] && grep -qiE "^ERROR:|Traceback|No module named" missing-stderr.txt; then
          echo "::error::dvc data status failed with errors:"
          cat missing-stderr.txt >&2
          exit 1
        fi

        # Check if anything is missing
        if grep -q "new:" missing-files.txt || grep -q "modified:" missing-files.txt; then
          {
            echo '## :warning: DVC Data Missing from Remote'
            echo ''
            echo 'The following files are not in the remote storage:'
            echo ''
            echo '```'
            cat missing-files.txt
            echo '```'
          } > missing-comment.md

          gh pr comment ${{ inputs.pr-number }} --body-file missing-comment.md

          echo "ERROR: Some DVC-tracked files are missing from the remote"
          exit 1
        else
          echo "All DVC-tracked files are present in the remote"
        fi
