name: 'DVC Remote Check'
description: 'Post the DVC diff for a PR and validate that all tracked data is present in one or more remotes.'
inputs:
  base-ref:
    description: 'Base git reference to compare against'
    required: false
    default: 'origin/main'
  dvc-remote:
    description: 'DVC remote name (single). Kept for backward compatibility; ignored when dvc-remotes is set.'
    required: false
    default: 'gs'
  dvc-remotes:
    description: 'Space-separated list of DVC remotes to validate (e.g. "bcarc_wts nci"). When set, every listed remote must contain all tracked data or the check fails. Overrides dvc-remote.'
    required: false
    default: ''
  pr-number:
    description: 'Pull request number for posting comments'
    required: true
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install credentials
      shell: bash
      run: |
        if command -v dt &>/dev/null; then
          echo "Installing DVC remote credentials via dt..."
          dt auth credentials install -v
        else
          echo "::warning::dt not available — skipping credential install"
        fi

    - name: Calculate and post DVC diff
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        # The diff compares git refs' .dvc hashes and is remote-independent.
        REMOTES="${{ inputs.dvc-remotes }}"
        [ -z "$REMOTES" ] && REMOTES="${{ inputs.dvc-remote }}"
        FIRST=$(echo "$REMOTES" | awk '{print $1}')
        dvc remote default "$FIRST"

        # Compare base ref to HEAD (not workspace — data files aren't materialized)
        if ! dt diff --old ${{ inputs.base-ref }} --new HEAD --output md > dvc-diff.md 2>&1; then
          echo "::error::dt diff failed:"
          cat dvc-diff.md >&2
          exit 1
        fi

        # GitHub caps PR comment bodies at 65536 chars; a large diff (e.g. a PR
        # adding thousands of DVC-tracked files) would otherwise make the comment
        # fail and take the whole job down with it. The diff is informational —
        # the data-in-remote check below is the actual gate — so truncate the
        # body and never let a comment failure fail the job.
        LIMIT=60000
        if [ "$(wc -c < dvc-diff.md)" -gt "$LIMIT" ]; then
          full=$(wc -c < dvc-diff.md)
          # Cut on a line boundary: a bare `head -c` can split a multi-byte UTF-8
          # character (dt diff emits — and …), leaving a body the API rejects.
          head -c "$LIMIT" dvc-diff.md | head -n -1 > dvc-diff.trunc.md
          # Degenerate case: no newline within the first $LIMIT bytes.
          [ -s dvc-diff.trunc.md ] \
            || head -c "$LIMIT" dvc-diff.md | iconv -c -f UTF-8 -t UTF-8 > dvc-diff.trunc.md 2>/dev/null || true
          printf '\n\n_…diff truncated — %s bytes exceeds the 65536-char GitHub comment limit._\n' "$full" \
            >> dvc-diff.trunc.md
          mv dvc-diff.trunc.md dvc-diff.md
        fi
        gh pr comment ${{ inputs.pr-number }} --body-file dvc-diff.md \
          || echo "::warning::failed to post DVC diff comment (continuing)"

    - name: Check DVC data present in remote(s)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        REMOTES="${{ inputs.dvc-remotes }}"
        [ -z "$REMOTES" ] && REMOTES="${{ inputs.dvc-remote }}"

        any_missing=0
        : > combined-missing.md

        for r in $REMOTES; do
          echo "::group::Checking remote '$r'"
          dvc remote default "$r"
          dvc data status --not-in-remote --granular > "missing-${r}.txt" 2> "stderr-${r}.txt" || true
          cat "missing-${r}.txt"
          echo "::endgroup::"

          # Fail immediately on genuine DVC errors (not just "missing data").
          if [ -s "stderr-${r}.txt" ] && grep -qiE "^ERROR:|Traceback|No module named" "stderr-${r}.txt"; then
            echo "::error::dvc data status failed for remote '$r':"
            cat "stderr-${r}.txt" >&2
            exit 1
          fi

          if grep -q "new:" "missing-${r}.txt" || grep -q "modified:" "missing-${r}.txt"; then
            any_missing=1
            {
              echo "### :warning: Data missing from remote \`$r\`"
              echo ''
              echo '```'
              cat "missing-${r}.txt"
              echo '```'
              echo ''
            } >> combined-missing.md
          else
            echo "All DVC-tracked files are present in remote '$r'"
          fi
        done

        if [ "$any_missing" -eq 1 ]; then
          {
            echo '## :warning: DVC Data Missing from Remote(s)'
            echo ''
            echo 'Some DVC-tracked files are not present in every validated remote.'
            echo 'Push them (e.g. `dvc push -r <remote>`) so the remotes stay in sync.'
            echo ''
            cat combined-missing.md
          } > missing-comment.md

          # Truncate under GitHub's 65536-char comment limit; a comment failure
          # must not mask the real failure (missing data) signalled by exit 1.
          LIMIT=60000
          if [ "$(wc -c < missing-comment.md)" -gt "$LIMIT" ]; then
            head -c "$LIMIT" missing-comment.md | head -n -1 > missing-comment.trunc.md
            [ -s missing-comment.trunc.md ] \
              || head -c "$LIMIT" missing-comment.md | iconv -c -f UTF-8 -t UTF-8 > missing-comment.trunc.md 2>/dev/null || true
            # Close the fenced block the truncation cut into.
            printf '\n```\n\n_…list truncated (exceeds the GitHub comment limit)._\n' >> missing-comment.trunc.md
            mv missing-comment.trunc.md missing-comment.md
          fi
          gh pr comment ${{ inputs.pr-number }} --body-file missing-comment.md \
            || echo "::warning::failed to post missing-data comment"

          echo "ERROR: DVC-tracked files are missing from one or more remotes"
          exit 1
        fi

        echo "All validated remotes contain every DVC-tracked file."
